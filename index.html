<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蘇白｜麥克風裡的海</title>
<meta name="description" content="蘇白的人聲混音與音樂製作作品集。從一間深夜的錄音間，走進麥克風裡的一片海。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>

<div id="loader">
  <div class="loader-art"></div>
  <div class="loader-inner">
    <p class="eyebrow">Vocal Mix · Music Production</p>
    <h1 class="loader-title">蘇白</h1>
    <div class="loader-bar"><i id="loader-fill"></i></div>
    <p class="loader-note" id="loader-note">調音中…</p>
    <div class="loader-enter">
      <button id="enter" class="pill pill-solid pill-lg" type="button">進入</button>
      <button id="enter-mute" class="enter-mute" type="button">靜音進入</button>
      <p class="enter-note">建議戴上耳機</p>
    </div>
  </div>
</div>

<header class="nav">
  <a class="brand" href="#" data-jump="0"><span class="brand-zh">蘇白</span><span class="brand-en">SUBAI</span></a>
  <nav class="nav-actions">
    <button id="sound" class="pill" type="button" aria-pressed="false"><span class="eq"><i></i><i></i><i></i></span><span id="sound-label">開啟聲音</span></button>
    <a class="pill nav-price" href="#" data-jump="price">價目表</a>
    <a class="pill pill-solid" href="#" data-jump="1">我要委託</a>
  </nav>
</header>

<ol id="rail" aria-label="作品導覽"></ol>

<main id="overlay">
  <section class="ov ov-hint" data-a="-1" data-b="0.015">
    <p class="scroll-hint"><span></span>Scroll</p>
  </section>

  <aside id="card" class="card" aria-live="polite">
    <p class="card-num"><span id="card-i">01</span> / 08</p>
    <h2 id="card-title" class="card-title"></h2>
    <p id="card-credit" class="card-credit"></p>
    <p id="card-sound" class="card-sound"></p>
    <a id="card-yt" class="card-link" target="_blank" rel="noopener">在 YouTube 聆聽 <span aria-hidden="true">↗</span></a>
  </aside>

  <section class="ov ov-ab" data-a="0.69" data-b="0.775" data-interactive>
    <div class="ab-ctrl">
      <button id="ab-play" class="ab-play" type="button" aria-label="播放 A/B 對照"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="ab-icon" d="M8 5v14l11-7z"/></svg></button>
      <div class="ab-slider">
        <input id="ab" type="range" min="0" max="1" step="0.001" value="0" aria-label="原始人聲到完成混音">
        <div class="ab-labels"><span>BEFORE<small>原始人聲</small></span><span>AFTER<small>完成混音</small></span></div>
      </div>
    </div>
  </section>

  <section class="ov ov-bubbles" data-a="2" data-b="2">
    <p class="bub-hint">點一顆氣泡，聽那首作品</p>
  </section>

  <section class="ov ov-outro" data-a="0.965" data-b="2" data-interactive>
    <div class="outro-cta">
      <a id="cta-commission" class="pill pill-solid pill-lg" href="#">開始委託</a>
      <a id="cta-x" class="pill pill-lg" target="_blank" rel="noopener">X @subaiyaya</a>
    </div>
  </section>
</main>

<div id="scroll-space"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
