<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>landmarks test</title>
<style>html,body{margin:0;height:100%;background:#1b1830;overflow:hidden}
#info{position:fixed;left:8px;top:8px;color:#fde;font:12px monospace;white-space:pre;pointer-events:none}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { LANDMARK_KINDS, buildLandmark } from './landmarks.js';
const r = new THREE.WebGLRenderer({ antialias: true });
r.setSize(innerWidth, innerHeight); r.setPixelRatio(devicePixelRatio);
r.shadowMap.enabled = true; r.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2145); scene.fog = new THREE.Fog(0x2a2145, 40, 90);
const cam = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
cam.position.set(0, 18, 38);
const ctl = new OrbitControls(cam, r.domElement); ctl.target.set(0, 3, 0);
scene.add(new THREE.HemisphereLight(0xffb48a, 0x3a2f66, 0.8));
const sun = new THREE.DirectionalLight(0xffa070, 2.2); sun.position.set(-20, 14, 12);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 20, bottom: -20, near: 1, far: 80 });
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 40), new THREE.MeshStandardMaterial({ color: 0x4a3f78, roughness: 0.9 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const items = [], lines = [];
LANDMARK_KINDS.forEach((k, i) => {
  const g = buildLandmark(k, { seed: i + 1 });
  g.position.set((i % 4 - 1.5) * 10, 0, (Math.floor(i / 4) - 0.5) * 10);
  scene.add(g); items.push(g);
  let tri = 0;
  g.traverse(o => { if (o.isMesh) { const ge = o.geometry; tri += (ge.index ? ge.index.count : ge.attributes.position.count) / 3; } });
  lines.push(k + ': ' + tri + ' tris');
});
document.getElementById('info').textContent = lines.join('\n');
const clock = new THREE.Clock();
r.setAnimationLoop(() => {
  const dt = clock.getDelta(), t = clock.elapsedTime;
  items.forEach(g => g.userData.update(t, dt));
  ctl.update(); r.render(scene, cam);
});
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); r.setSize(innerWidth, innerHeight); });
</script></body></html>
